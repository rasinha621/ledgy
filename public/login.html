<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ledgy</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><img class="logo" src="/icon.svg" alt="" aria-hidden="true"><span>Ledgy</span></div>
    <h1>Sign in</h1>
    <p class="muted">Use your Ledgy login to continue.</p>
    <form id="loginForm" method="post" action="/login">
      <label class="tf"><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus placeholder=" "><span>Username</span></label>
      <label class="tf"><input name="password" type="password" autocomplete="current-password" required placeholder=" "><span>Password</span></label>
      <div id="loginErr" class="login-err" role="alert"></div>
      <div class="login-actions">
        <button type="submit" id="loginGo" class="btn primary">Sign in</button>
      </div>
    </form>
  </main>
</body>
</html>
