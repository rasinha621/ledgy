services:
  ledgy:
    build: .
    pull_policy: build
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-568} # TrueNAS "apps" user
      - PGID=${PGID:-568}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      - ALLOW_NO_AUTH=${ALLOW_NO_AUTH:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TRUST_PROXY=1
    volumes:
      - ledgy-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ledgy
    ports:
      - ${HTTPS_PORT:-8443}:8443
    environment:
      - LEDGY_HOST=${LEDGY_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  ledgy-data: null
  caddy-data: null
  caddy-config: null
networks: {}
