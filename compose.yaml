services:
  ledgy:
    build: .
    pull_policy: build
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      - ALLOW_NO_AUTH=${ALLOW_NO_AUTH:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - LEDGY_HOST=${LEDGY_HOST:-localhost}
      - TRUST_PROXY=1
    volumes:
      - ledgy-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ledgy
    ports:
      - "${HTTPS_PORT:-8443}:8443"   # TrueNAS uses 443 for its own web UI, so Ledgy uses 8443
    environment:
      - LEDGY_HOST=${LEDGY_HOST:-localhost}
      - TAILSCALE_HOST=${TAILSCALE_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # Holds the certificate authority, so keep this volume
      - caddy-config:/config

volumes:
  ledgy-data:
  caddy-data:
  caddy-config:
