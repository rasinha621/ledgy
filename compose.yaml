services:
  ledgy:
    build: .
    pull_policy: build
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      - ALLOW_NO_AUTH=${ALLOW_NO_AUTH:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - LEDGY_HOST=${LEDGY_HOST:-localhost}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    volumes:
      - ledgy-data:/data

volumes:
  ledgy-data:
